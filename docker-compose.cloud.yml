services:
  trader-runtime:
    build:
      context: .
      dockerfile: services/trader-runtime/Dockerfile.cloud
    volumes:
      - ai-trader-cloud-data:/data
    environment:
      AI_TRADER_AUTH_MODE: cloud-jwt
      AI_TRADER_CLOUD_JWT_SECRET: ${AI_TRADER_CLOUD_JWT_SECRET:-}
      AI_TRADER_CLOUD_AUTH_PROVIDER: ${AI_TRADER_CLOUD_AUTH_PROVIDER:-development-hs256}
      AI_TRADER_CLOUD_TENANT_ID: ${AI_TRADER_CLOUD_TENANT_ID:-demo-tenant}
      AI_TRADER_OIDC_ISSUER: ${AI_TRADER_OIDC_ISSUER:-}
      AI_TRADER_OIDC_AUDIENCE: ${AI_TRADER_OIDC_AUDIENCE:-}
      AI_TRADER_OIDC_JWKS_URL: ${AI_TRADER_OIDC_JWKS_URL:-}
      AI_TRADER_OIDC_TENANT_CLAIM: ${AI_TRADER_OIDC_TENANT_CLAIM:-tid}
      AI_TRADER_ALLOWED_ORIGINS: ${AI_TRADER_ALLOWED_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}
      AI_TRADER_SECURE_COOKIES: ${AI_TRADER_SECURE_COOKIES:-0}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/healthz')); assert d['status']=='ok' and d['liveTrading']=='disabled'"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
      args:
        VITE_CLOUD_RUNTIME_URL: ${AI_TRADER_PUBLIC_RUNTIME_URL:-http://127.0.0.1:8080}
        VITE_ALLOW_INSECURE_LOCAL_CLOUD: ${AI_TRADER_ALLOW_INSECURE_LOCAL_CLOUD:-1}
        VITE_DEFAULT_RUNTIME_MODE: cloud
        VITE_CLOUD_AUTH_MODE: cloud-jwt
        VITE_APP_BASE_PATH: ${AI_TRADER_WEB_BASE_PATH:-/}
        AI_TRADER_BUILD_SHA: ${AI_TRADER_BUILD_SHA:-development}
        AI_TRADER_BUILD_VERSION: ${AI_TRADER_BUILD_VERSION:-0.8.7}
    depends_on:
      trader-runtime:
        condition: service_healthy
    ports:
      - "${AI_TRADER_CLOUD_BIND_ADDRESS:-127.0.0.1}:${AI_TRADER_CLOUD_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m,mode=1777
      - /var/run:size=4m,mode=1777
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  ai-trader-cloud-data:
