<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Title bar / status bar colour: theme.ts sets it to the current theme's header surface. -->
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="Sente · AI 私人交易助理" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <!-- 放到主屏幕 (2026-10-06): the iPhone home-screen icon (180 px, square, iOS rounds it) and the
         full-screen web-app tags; the name under the icon is Sente. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sente" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Sente</title>
    <!-- Figures font (theme.css --font-mono). Declared here, not in the bundled CSS: the web build's
         styles load from the OSS asset origin while the CSP allows fonts only from 'self', so the
         path is relative to this page — /trader/fonts/ on the web, the app's own files on desktop. -->
    <style>
      @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 400; font-display: swap; src: url("fonts/JetBrainsMono-Regular.subset.woff2") format("woff2"); unicode-range: U+0020-007E, U+00B7, U+00D7, U+2192, U+2212; }
      @font-face { font-family: "JetBrains Mono"; font-style: normal; font-weight: 500 700; font-display: swap; src: url("fonts/JetBrainsMono-Medium.subset.woff2") format("woff2"); unicode-range: U+0020-007E, U+00B7, U+00D7, U+2192, U+2212; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
