[package]
name = "ai-trader-desktop"
version = "1.8.1"
description = "AI Trader Tauri desktop shell"
authors = ["kingcharleslzy-ai"]
edition = "2021"
default-run = "ai-trader-desktop"

[features]
delta-tools = []

[[bin]]
name = "ai-trader-delta"
path = "src/bin/ai-trader-delta.rs"
required-features = ["delta-tools"]

[lib]
name = "ai_trader_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }
serde_json = "1"

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.37.2"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-shell = "2.3.5"
tauri-plugin-updater = "2.10.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-dialog = "2.7.3"
tokio = { version = "1", features = ["sync", "time"] }
zeroize = "1.8"
base64 = "0.22"
minisign-verify = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
futures-util = "0.3"
qbsdiff = "=1.4.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSKeyValueCoding", "NSObject", "NSGeometry", "NSString", "NSValue"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "WKPreferences", "WKWebView", "WKWebViewConfiguration", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
windows = { version = "=0.61.3", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[profile.release]
lto = "thin"
opt-level = "s"
strip = "symbols"
