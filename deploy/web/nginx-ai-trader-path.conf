# Include inside the HTTPS server block for qilinshuzhi.com.
# Web app at /trader/ (owner 2026-09-30; the old /ai-trader and /trader/ addresses are gone):
# /var/www/trader is the atomic symlink deploy-web.sh switches, and /var/www/trader is a
# one-time symlink to it so `root /var/www` serves /trader/. /trader/download is the site
# application's download page.
# The 后台管理 page (owner 2026-10-01) is /trader/admin: the /trader/ fallback already serves
# index.html there and main.tsx boots AdminApp for that path, so it needs no location of its own.
# Pyodide (browser backtests, 2026-09-30): fixed, versioned files under /var/www/ai-trader/pyodide/v<version>/ with
# level-9 .gz copies; uploaded once per Pyodide version (not by deploy-web.sh). The desktop client loads them cross-origin.
location ^~ /trader/pyodide/ {
    # /var/www/trader-assets/trader/pyodide -> /var/www/ai-trader/pyodide (one-time symlink).
    root /var/www/trader-assets;
    gzip_static on;
    types { text/javascript js mjs; application/wasm wasm; application/json json; application/zip zip whl; }
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    if ($http_origin ~ ^(tauri://localhost|https?://tauri\.localhost)$) {
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }
    try_files $uri =404;
}

# The upstream `sente_runtime_relay` and map `$sente_relay_connection` live at http level in
# qilinshuzhi-site deploy/nginx/qilinshuzhi.conf (the authoritative copy of this file).
# Sente Runtime 同源中转（见文件顶部 upstream 说明）。前缀剥掉后原样转发；IP 用 X-Real-IP
# 交给腾讯云 nginx（它只对本机 IP 信任这个头），X-Forwarded-For 覆盖为真实地址，不透传客户端伪造值。
# SSE 与实时语音是长连接：不缓冲、超时一小时。Cookie 收窄到 /trader-runtime/，不发给官网应用。
location ^~ /trader-runtime/ {
    proxy_pass https://sente_runtime_relay/;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name ai-runtime.qilinshuzhi.com;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/pki/tls/certs/ca-bundle.crt;
    proxy_ssl_session_reuse on;
    proxy_set_header Host ai-runtime.qilinshuzhi.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sente_relay_connection;
    proxy_redirect https://ai-runtime.qilinshuzhi.com:8443/ /trader-runtime/;
    proxy_cookie_path / /trader-runtime/;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 16m;
}

location = /trader {
    return 308 /trader/;
}

# The download page (owner 2026-09-30: qilinshuzhi.com/trader/download) belongs to the site app;
# the exact match wins over the web app's /trader/ prefix.
location = /trader/download {
    proxy_pass http://qilin_site_app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
}

location = /trader/download/ {
    return 308 /trader/download;
}

location = /trader/version.json {
    root /var/www;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://ai-trader-updates-hz.oss-cn-hangzhou.aliyuncs.com; script-src 'self' 'wasm-unsafe-eval' https://ai-trader-updates-hz.oss-cn-hangzhou.aliyuncs.com; worker-src 'self'; font-src 'self' data:; connect-src 'self' wss://qilinshuzhi.com https://ai-runtime.qilinshuzhi.com:8443 wss://ai-runtime.qilinshuzhi.com:8443; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri =404;
}

location ^~ /trader/assets/ {
    root /var/www;
    # deploy-web.sh ships level-9 .gz copies; nginx serves them to gzip clients as is.
    gzip_static on;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://ai-trader-updates-hz.oss-cn-hangzhou.aliyuncs.com; script-src 'self' 'wasm-unsafe-eval' https://ai-trader-updates-hz.oss-cn-hangzhou.aliyuncs.com; worker-src 'self'; font-src 'self' data:; connect-src 'self' wss://qilinshuzhi.com https://ai-runtime.qilinshuzhi.com:8443 wss://ai-runtime.qilinshuzhi.com:8443; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri =404;
}

location ^~ /trader/ {
    root /var/www;
    # deploy-web.sh ships level-9 .gz copies; nginx serves them to gzip clients as is.
    gzip_static on;
    add_header Cache-Control "no-cache" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://ai-trader-updates-hz.oss-cn-hangzhou.aliyuncs.com; script-src 'self' 'wasm-unsafe-eval' https://ai-trader-updates-hz.oss-cn-hangzhou.aliyuncs.com; worker-src 'self'; font-src 'self' data:; connect-src 'self' wss://qilinshuzhi.com https://ai-runtime.qilinshuzhi.com:8443 wss://ai-runtime.qilinshuzhi.com:8443; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=()" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    try_files $uri $uri/ /trader/index.html;
}

