limit_req_zone $binary_remote_addr zone=ai_trader_auth_per_ip:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=ai_trader_api_per_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=ai_trader_conn_per_ip:10m;
# WebSocket upgrade (real-time voice at /api/voice/realtime); plain requests keep their Connection header.
map $http_upgrade $ai_trader_connection_upgrade {
    default upgrade;
    ''      close;
}
# Blue-green switch point: this include holds only `server 127.0.0.1:<port>;` for the
# active Runtime slot (18000 = blue, 18001 = green). deploy-release.sh rewrites it and
# reloads nginx; every proxy_pass below goes through the ai_trader_runtime upstream.
include /etc/nginx/ai-trader-runtime-upstream.conf;

server {
    listen 80;
    listen [::]:80;
    server_name ai-runtime.qilinshuzhi.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name ai-runtime.qilinshuzhi.com;

    ssl_certificate /etc/letsencrypt/live/ai-runtime.qilinshuzhi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-runtime.qilinshuzhi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AITraderSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    server_tokens off;

    # 网页版经官网 443 中转（阿里云 112.124.42.19 的 /trader-runtime/，2026-10-11 #712 A）：只对这台
    # 机器信任 X-Real-IP，把 $remote_addr 还原成真实访客，限流与游客按 IP 的额度才不会挤在一起。
    set_real_ip_from 112.124.42.19;
    real_ip_header X-Real-IP;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;

    location = /healthz {
        proxy_pass http://ai_trader_runtime/healthz;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /api/auth/owner {
        limit_except POST OPTIONS { deny all; }
        limit_req zone=ai_trader_auth_per_ip burst=5 nodelay;
        limit_conn ai_trader_conn_per_ip 4;
        proxy_pass http://ai_trader_runtime;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, never append: uvicorn's --forwarded-allow-ips=* takes the leftmost
        # XFF entry, so $proxy_add_x_forwarded_for would let a direct client name any
        # address and rotate the app's per-visitor login/register budget (#735).
        # $remote_addr is the address realip restored (direct peer, or the real visitor
        # named by the trusted website relay above).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    # 本机算完的回测报告（POST /api/strategy-backtests/browser-result，最多 2000 笔逐笔）可超过全局 1m：
    # 只放宽这一条精确路由，其余 API 仍是 1m。代理设置与下面的 /api/ 块相同，改一边要同步另一边。
    location = /api/strategy-backtests/browser-result {
        client_max_body_size 8m;
        limit_req zone=ai_trader_api_per_ip burst=200 nodelay;
        limit_conn ai_trader_conn_per_ip 200;
        limit_conn_status 429;
        limit_req_status 429;
        proxy_pass http://ai_trader_runtime;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        gzip on;
        gzip_proxied any;
        gzip_types application/json;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_vary on;
    }

    location ^~ /api/ {
        limit_req zone=ai_trader_api_per_ip burst=200 nodelay;
        # Every desktop/web window behind one proxy exit shares an IP, and HTTP/2 counts each
        # concurrent request and event stream; 20 starved a replay window (2026-09-24).
        limit_conn ai_trader_conn_per_ip 200;
        limit_conn_status 429;
        limit_req_status 429;
        proxy_pass http://ai_trader_runtime;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ai_trader_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Same overwrite as the owner login location above (#735): the leftmost XFF
        # entry must be the proxy's own restored address, not client-supplied text.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        # Compress JSON and the event stream (2026-10-04): ~3.2 Mbps down for 100 online users
        # uncompressed. Measured locally through this block: each event still arrives at once
        # (nginx flushes gzip per upstream chunk with buffering off, +0.1 ms), payload ~1/10.
        gzip on;
        gzip_proxied any;
        gzip_types application/json text/event-stream;
        gzip_comp_level 5;
        gzip_min_length 256;
        gzip_vary on;
    }

    location / {
        return 404;
    }
}
