# Loopback-only image registry on the production host (2026-10-09): image builds moved to the home
# NAS, which pushes linux/amd64 Runtime/Sidecar images here by full-sha tag through its tunnel's
# local forward (NAS 127.0.0.1:15000 → this host's 127.0.0.1:5000); deploy-release.sh then pulls
# and verifies them. Docker treats loopback registries as plain-HTTP by default, so no daemon
# config is needed. Deployed as its own compose project, never touched by the release flow:
#
#   sudo mkdir -p /opt/ai-trader/registry
#   sudo cp deploy/vps/docker-compose.registry.yml /opt/ai-trader/registry/
#   cd /opt/ai-trader/registry && sudo docker compose -p ai-trader-registry up -d
#
# Rollback: sudo docker compose -p ai-trader-registry down (keep ./data unless retiring the path),
# then build on the production host itself with `deploy-release.sh <sha> --build-on-host`.
services:
  registry:
    image: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # The hourly host maintenance entry deletes proven stale release manifests by API, then
      # runs official GC while the public push/pull instance is stopped. Unknown roots, shared
      # OCI children, retained releases and running/stopped container identities stay protected.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - ./data:/var/lib/registry
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
